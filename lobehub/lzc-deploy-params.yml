params:
  - id: jwks_key
    type: secret
    name: "JWKS_KEY"
    description: "RS256 JWKS JSON 字符串。用于 Agent Gateway 校验浏览器会话 JWT，并提供内部 JWT 签发；配置后桌面端 OIDC 自动启用（官方已无独立 ENABLE_OIDC 开关）。留空则 Gateway Mode 与 OIDC 均不生效，对话回退到浏览器端执行。生成方式见 https://lobehub.com/docs/self-hosting/platform/docker-compose 的 Agent Gateway 小节。"
    optional: true

locales:
  zh:
    jwks_key:
      name: "JWKS_KEY"
      description: "RS256 JWKS JSON 字符串。用于 Agent Gateway 校验浏览器会话 JWT，并提供内部 JWT 签发；配置后桌面端 OIDC 自动启用（官方已无独立 ENABLE_OIDC 开关）。留空则 Gateway Mode 与 OIDC 均不生效，对话回退到浏览器端执行。生成方式见 https://lobehub.com/docs/self-hosting/platform/docker-compose 的 Agent Gateway 小节。"
  zh_CN:
    jwks_key:
      name: "JWKS_KEY"
      description: "RS256 JWKS JSON 字符串。用于 Agent Gateway 校验浏览器会话 JWT，并提供内部 JWT 签发；配置后桌面端 OIDC 自动启用（官方已无独立 ENABLE_OIDC 开关）。留空则 Gateway Mode 与 OIDC 均不生效，对话回退到浏览器端执行。生成方式见 https://lobehub.com/docs/self-hosting/platform/docker-compose 的 Agent Gateway 小节。"
  en:
    jwks_key:
      name: "JWKS_KEY"
      description: "RS256 JWKS JSON string. Used by the Agent Gateway to verify browser session JWTs and to sign internal JWTs. Setting it also enables desktop OIDC automatically (the official build has no separate ENABLE_OIDC switch). When left empty, neither Gateway Mode nor OIDC takes effect and chats fall back to browser-side execution. See the Agent Gateway section of https://lobehub.com/docs/self-hosting/platform/docker-compose for how to generate it."
